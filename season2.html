.star { cursor:pointer; font-size:1.25em; color:#ccc; }
.star.on { color:#f5a623; }
.ecard { background:#fff; border-radius:10px; padding:12px 16px; margin-top:8px; }
.ecard input { width:60px; padding:4px 6px; border:1px solid #ccc;

    _genShop(ns); _simSave(ns); out = _simState(ns);
  } else if (url === '/sim/nextday') {
    if (!sim.box.length) { ok = false; out = {error: 'pull a box first'}; }
    else {
      sim.day = (sim.day || 0) + 1;
      sim.coins = (sim.coins || 0) + DATA.econ.daily_coins;
      if ((sim.items || []).some(i => DATA.econ.money_items.includes(i)))
        sim.coins += DATA.econ.money_item_bonus;
      _genShop(sim); _simSave(sim); out = _simState(sim);
    }
  } else if (url === '/sim/buy') {
    const b = JSON.parse(opts.body);
    let price = null;
    try {
      price = b.kind === 'pokemon'
        ? (DATA.econ.tier_prices[S2DEX[sim.shop.pokemon[b.index]].s2] || 99)
        : _itemPrice(sim.shop.items[b.index]);
    } catch (e) { ok = false; out = {error: 'slot already bought'}; }
    if (price !== null) {
      if ((sim.coins || 0) < price) { ok = false;
        out = {error: 'not enough coins'}; }
      else {
        sim.coins -= price;
        if (b.kind === 'pokemon') sim.box.push(sim.shop.pokemon.splice(b.index, 1)[0]);
        else sim.items.push(sim.shop.items.splice(b.index, 1)[0]);
        _simSave(sim); out = _simState(sim);
      }
    }
  } else { ok = false; out = {}; }
  return {ok: ok, json: async () => out};
};

    e.recipes.fusions.map(r => esc(r[0]) + ' + ' + esc(r[1]) + ' → ' +
    esc(r[2])).join(', ') + '</p></div>' +
    '<div class="ecard"><h3>Tier unlock requirements (best-tag count ' +
    'needed before that tier can appear AT ALL)</h3>' +
    '<p style="margin-top:6px">' +
    ['lc','zu','pu','nu','ru','uu','uubl','ou','ubers'].map(t =>
      S2LABEL[t] + ': ' + num('ec-req-' + t, e.tier_requirements[t])
    ).join(' · ') + '</p></div>'  +
    '<div class="ecard"><button onclick="saveEcon()" class="s2chip" ' +
    'style="background:#2e7d32;font-size:1em;padding:8px 20px">Save</button>' +
    ' <span id="ec-state"></span>' +
    '<p style="margin-top:8px;color:#666;font-size:.85em">Example: on the ' +
    'saved numbers a player on a 3-win streak earns daily + win + streak-3 ' +
    'bonus coins that day. Streak bonuses cap at the 5th value.</p></div>';
  document.getElementById('ec-money').addEventListener('input', ev => {
    document.getElementById('ec-money-out').textContent = ev.target.value;
  });
}
async function saveEcon() {
  const g = id => Number(document.getElementById(id).value) || 0;
  const body = {daily_coins: g('ec-daily'), win_coins: g('ec-win'),
    loss_coins: g('ec-loss'), money_item_bonus: g('ec-money'),
    form_change_cost: g('ec-form'), fusion_cost: g('ec-fusion'),
    tier_requirements: Object.fromEntries(
      ['lc','zu','pu','nu','ru','uu','uubl','ou','ubers'].map(t =>
        [t, g('ec-req-' + t)])),
    win_streak_bonus: [0, 1, 2, 3, 4].map(i => g('ec-ws' + i)),
    lose_streak_bonus: [0, 1, 2, 3, 4].map(i => g('ec-ls' + i))};
  const r = await fetch('/economy/set', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  document.getElementById('ec-state').textContent =
    r.ok ? 'saved ✓' : 'save failed';
}
document.getElementById('search').addEventListener('input', renderS2);
document.getElementById('s2-onlychanged').addEventListener('change', renderS2);
document.getElementById('isearch').addEventListener('input', renderItems);
loadS2();
loadItems();
loadEcon();
loadSim().then(() => renderS2());

</script>
