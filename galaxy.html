build(S2MONS);

function build(mons) {
  nodes = []; links = []; hubs = [];
  const hubOf = {};
  const mkHub = (name, color, isRegion) => {
    const h = {id: 'hub-' + name, hub: true, name: name, color: color,
               region: isRegion, r: 9,
               x: W/2 + (Math.random()-.5)*600,
               y: H/2 + (Math.random()-.5)*600};
    hubOf[name] = h; hubs.push(h); nodes.push(h);
  };
  Object.entries(TYPE_COLORS).forEach(([t, c]) => mkHub(t, c, false));
  REGIONS.forEach(r => mkHub(r, '#8a93a6', true));
  mons.forEach(m => {
    const n = {id: m.pokemon, name: m.name, types: m.types,
               regionTag: m.region, tier: m.s2,
               color: TYPE_COLORS[m.types[0]] || '#888',
               r: TIER_R[m.s2] || 2,
               x: W/2 + (Math.random()-.5)*900,
               y: H/2 + (Math.random()-.5)*900};
    nodes.push(n);
    m.types.forEach(t => { if (hubOf[t])
      links.push({source: n, target: hubOf[t], kind: 'type'}); });
    if (hubOf[m.region])
      links.push({source: n, target: hubOf[m.region], kind: 'region'});
  });
  restart();
}
function activeLinks() {
  if (mode === 'types') return links.filter(l => l.kind === 'type');
  if (mode === 'regions') return links.filter(l => l.kind === 'region');
  return links;
}
function restart() {
  if (sim) sim.stop();
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(activeLinks()).strength(0.05).distance(60))
    .force('charge', d3.forceManyBody().strength(-14).theta(0.9)
      .distanceMax(500))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collide', d3.forceCollide().radius(n => n.r + 1).iterations(1))
    .alpha(1).alphaDecay(0.008)
    .on('tick', draw);
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(transform.k, 0, 0, transform.k,
                   transform.x, transform.y);
  const act = activeLinks();
  const focus = hover || searchHit;
  ctx.lineWidth = 0.4 / transform.k;
  ctx.strokeStyle = 'rgba(120,130,160,0.06)';
  ctx.beginPath();
  for (const l of act) {
    if (focus && l.source !== focus && l.target !== focus) continue;
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
  }
  if (!focus) ctx.stroke();
  else {
    ctx.strokeStyle = 'rgba(230,230,150,0.9)';
    ctx.lineWidth = 1.2 / transform.k;
    ctx.stroke();
  }
  for (const n of nodes) {
    const dim = focus && n !== focus && !act.some(l =>
      (l.source === focus && l.target === n) ||
      (l.target === focus && l.source === n));
    ctx.globalAlpha = dim ? 0.15 : 1;
    ctx.beginPath();
    ctx.fillStyle = n.color;
    ctx.arc(n.x, n.y, n.r, 0, 6.284);
    ctx.fill();
    if (n.hub) {
      ctx.globalAlpha = dim ? 0.2 : 0.9;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + (13 / Math.sqrt(transform.k)) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(n.name.toUpperCase(), n.x, n.y - 12);
    }
  }
  ctx.globalAlpha = 1;
  if (focus && !focus.hub) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + (14 / Math.sqrt(transform.k)) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(focus.name, focus.x, focus.y - focus.r - 6);
  }
}
d3.select(canvas).call(d3.zoom()
  .scaleExtent([0.15, 8])
  .on('zoom', ev => { transform = ev.transform; draw(); }));
canvas.addEventListener('mousemove', ev => {
  const [mx, my] = transform.invert([ev.offsetX, ev.offsetY]);
  hover = sim ? sim.find(mx, my, 18 / transform.k) : null;
  const info = document.getElementById('info');
  if (hover && !hover.hub) {
    info.style.display = 'block';
    info.innerHTML = '<img src="' + (SPRITE[hover.id] || '') +
      '" style="width:56px;height:56px;float:left;margin-right:10px">' +
      '<b>' + hover.name + '</b><br>' +
      hover.tier.toUpperCase() + ' · ' + hover.types.join('/') +
      ' · ' + hover.regionTag +
      '<br><span style="color:#888">shares tags with everything in its ' +
      'constellations</span>';
  } else if (hover && hover.hub) {
    const n = links.filter(l => l.target === hover).length;
    info.style.display = 'block';
    info.innerHTML = '<b>' + hover.name + '</b> ' +
      (hover.region ? 'region' : 'type') + ' — ' + n + ' Pokemon';
  } else info.style.display = 'none';
  draw();
});
document.getElementById('q').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  searchHit = q ? nodes.find(n => !n.hub &&
    n.name.toLowerCase().includes(q)) : null;
  if (searchHit) {
    transform = d3.zoomIdentity.translate(
      W/2 - searchHit.x * 1.6, H/2 - searchHit.y * 1.6).scale(1.6);
    d3.select(canvas).call(d3.zoom().transform, transform);
  }
  draw();
});
['both', 'types', 'regions'].forEach(m => {
  document.getElementById('m-' + m).onclick = () => {
    mode = m;
    ['both', 'types', 'regions'].forEach(x =>
      document.getElementById('m-' + x).classList.toggle('on', x === m));
    restart();
  };
});
